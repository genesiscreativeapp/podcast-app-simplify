# Les variables sont lues depuis .env en local, ou depuis l'onglet « Environment Variables » de Coolify.
# Une valeur vide = valeur par défaut de l'application (voir .env.example).
# L'IA (clé Anthropic) ne se règle plus ici : l'administrateur la configure dans l'interface (pastille « IA »).
x-env: &env
  APP_USER: ${APP_USER:-}
  APP_PASSWORD: ${APP_PASSWORD:-}
  SECRET_KEY: ${SECRET_KEY:-}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_PREFIX: ${R2_PREFIX:-}
  R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
  R2_LINK_EXPIRES: ${R2_LINK_EXPIRES:-}
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
  WHISPER_MODEL_DETECT: ${WHISPER_MODEL_DETECT:-}
  DETECT_CLIP: ${DETECT_CLIP:-}
  WHISPER_MODEL_EDIT: ${WHISPER_MODEL_EDIT:-}
  WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
  WHISPER_WORKERS: ${WHISPER_WORKERS:-}
  WHISPER_THREADS: ${WHISPER_THREADS:-}
  WHISPER_BEAM_EDIT: ${WHISPER_BEAM_EDIT:-}
  MAX_PARALLEL_JOBS: ${MAX_PARALLEL_JOBS:-}
  MAX_PAUSE: ${MAX_PAUSE:-}
  TARGET_PAUSE: ${TARGET_PAUSE:-}
  REMOVE_FILLERS: ${REMOVE_FILLERS:-}
  REMOVE_REACTIONS: ${REMOVE_REACTIONS:-}
  PAUSE_DAYS: ${PAUSE_DAYS:-}
  AMBIENT_ATTEN_DB: ${AMBIENT_ATTEN_DB:-}
  FADE_OUT: ${FADE_OUT:-}
  END_MARGIN: ${END_MARGIN:-}
  REMOVE_REPEATS: ${REMOVE_REPEATS:-}
  MP3_BITRATE: ${MP3_BITRATE:-}
  PODCAST_ARTIST: ${PODCAST_ARTIST:-}
  YTDLP_COOKIES: ${YTDLP_COOKIES:-}
  YTDLP_FORMAT: ${YTDLP_FORMAT:-}
  KEEP_SOURCES: ${KEEP_SOURCES:-}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
  STAGING_DAYS: ${STAGING_DAYS:-}
  SESSION_DAYS: ${SESSION_DAYS:-}
  REPEAT_MAX_GAP: ${REPEAT_MAX_GAP:-}
  REPEAT_MAX_WORDS: ${REPEAT_MAX_WORDS:-}
  WHISPER_PROMPT: ${WHISPER_PROMPT:-}
  REMOVE_OFFTOPIC: ${REMOVE_OFFTOPIC:-}
  DENOISE_DB: ${DENOISE_DB:-}
  OFFTOPIC_PAD_BEFORE: ${OFFTOPIC_PAD_BEFORE:-}
  OFFTOPIC_PAD_AFTER: ${OFFTOPIC_PAD_AFTER:-}
  KEEP_WORK_FILES: ${KEEP_WORK_FILES:-}

services:
  web:
    build: .
    restart: unless-stopped
    environment: *env
    expose:
      - "3000"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    environment: *env
    command: ["python", "-m", "app.worker"]
    volumes:
      - data:/data
    stop_grace_period: 30s

  # Optionnel : calcule la VERSION ANGLAISE des podcasts (traduction + voix du prédicateur) et les essais de l'écran « Voix anglaise »
  # (PyTorch, Chatterbox, traducteur local : image de plusieurs Go).
  # Démarré avec le reste. Sa construction est longue la première fois (plusieurs Go) ; s'il échoue, l'application continue de fonctionner
  # et l'écran « Voix anglaise » indique qu'il n'est pas actif : regardez alors le journal de construction ou d'exécution de ce service.
  voicelab:
    build:
      context: .
      dockerfile: Dockerfile.voicelab
    restart: unless-stopped
    environment: *env
    volumes:
      - data:/data
    stop_grace_period: 30s

# Le volume « data » contient la base (comptes, dossiers, réglages, clés chiffrées), secret.key, les podcasts et les modèles Whisper :
# à sauvegarder. Sans SECRET_KEY, secret.key est la seule clé de chiffrage des clés Anthropic enregistrées.
volumes:
  data:
